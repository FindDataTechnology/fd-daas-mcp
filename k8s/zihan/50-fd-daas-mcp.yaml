# fd-daas-mcp — deployment on zihan k3s, namespace fd-mcp.
# NodePort 30804 follows the sequence: 30801=fd-open-data-mcp, 30802=fd-cn-report,
# 30803=fd-find-data-business-mcp. Image tag: pin to sha-<short> once docker-publish lands.
# Reuses shared fd-mcp-env Secret (add MCP_BEARER_TOKEN to it before applying).

apiVersion: apps/v1
kind: Deployment
metadata:
  name: fd-daas-mcp
  namespace: fd-mcp
  labels:
    app.kubernetes.io/name: fd-daas-mcp
    app.kubernetes.io/part-of: finddata
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: fd-daas-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fd-daas-mcp
        app.kubernetes.io/part-of: finddata
    spec:
      containers:
        - name: fd-daas-mcp
          image: harbor.local/finddata/fd-daas-mcp:latest
          imagePullPolicy: Always
          ports:
            - name: mcp
              containerPort: 8311
          envFrom:
            - secretRef:
                name: fd-mcp-env
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "500m"
              memory: 1Gi
          startupProbe:
            tcpSocket:
              port: mcp
            periodSeconds: 5
            failureThreshold: 12
          readinessProbe:
            tcpSocket:
              port: mcp
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: mcp
            periodSeconds: 20
            failureThreshold: 3
          volumeMounts:
            - name: data
              mountPath: /app/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: fd-daas-mcp-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: fd-daas-mcp
  namespace: fd-mcp
  labels:
    app.kubernetes.io/name: fd-daas-mcp
    app.kubernetes.io/part-of: finddata
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: fd-daas-mcp
  ports:
    - name: mcp
      port: 8311
      targetPort: mcp
      nodePort: 30804
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: fd-daas-mcp-pvc
  namespace: fd-mcp
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: local-path
