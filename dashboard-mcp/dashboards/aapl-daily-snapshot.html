<script>
(function () {
  const DATA = JSON.parse(document.getElementById("dashboard-data").textContent);
  const entitySelect = document.getElementById("entity-select");
  DATA.entities.forEach(e => { const o = document.createElement("option"); o.value = e; o.textContent = e; entitySelect.appendChild(o); });

  }
  function render() {
    const rows = getFiltered();
    chartA.setOption({
      tooltip: { trigger: "axis" },
      grid: { left: 50, right: 20, top: 30, bottom: 30 },
      xAxis: { type: "category", data: rows.map(r => r.date) },
      yAxis: { type: "value", scale: true },
      series: [{ name: "Close", type: "line", data: rows.map(r => r.close), smooth: true, lineStyle: { width: 2 }, areaStyle: { opacity: 0.08 } }],

  entitySelect.addEventListener("change", render);
  startInput.addEventListener("change", render);
  endInput.addEventListener("change", render);
  window.addEventListener("resize", () => chartA.resize());
  render();
})();
