[project]
name = "daas"
version = "0.2.0"
description = "DAAS - Data As a Service: layered MCP stack. fd-open-data-mcp (sibling repo) owns data-fetch adapters + the entity master; fd-daas-mcp owns daas/cron/alerts/dashboard/composite/research/pdf/gateway/workflow. Fetch goes through workflow manifests, not direct library imports."
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "requests>=2.31",
    # ponytail: data libs (akshare/yfinance/edgar/edinet-tools/dartlab/
    # world_bank_data/ckanapi) live in the fd-open-data-mcp sibling repo now;
    # DAAS talks to it over MCP, so they are not root deps. run_indicator.py
    # + upsert.py only need pandas/numpy + stdlib sqlite3.
]

# Docs site (docs-site/). The `dev` dependency group is installed by default
# with `uv sync`, so `uv run mkdocs build` / `uv run mkdocs serve` work as-is.
[dependency-groups]
dev = [
    "mkdocs-material==9.5.*",
    "mkdocs-static-i18n==1.2.*",
]
