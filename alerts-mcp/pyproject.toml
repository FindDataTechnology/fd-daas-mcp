[project]
name = "alerts-mcp"
version = "0.1.0"
description = "Alerts MCP — inspect DB series, evaluate trigger rules, dispatch to social/chat channels (cron-driven)"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=2.0",
    "httpx>=0.27",
    "sqlalchemy>=2.0",
    "python-dotenv>=1.0",
    "mcp-models",
]

[tool.setuptools]
py-modules = [
    "server",
    "alert_tools",
    "alert_database",
    "expressions",
    "messaging",
    "engine",
]

[tool.uv.sources]
mcp-models = { path = "../models", editable = true }
